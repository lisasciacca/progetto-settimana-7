<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SportsHub</title>

    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Il mio CSS, dopo Bootstrap -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <!-- Punto di ingresso dei moduli -->
    <script type="module" src="js/main.js"></script>
  </head>

  <body>
    <!-- HEADER CON RICERCA -->
    <header class="hero">
      <h1 class="hero-titolo">SportsHub</h1>
      <p class="hero-sottotitolo">
        Cerca una squadra, scopri prossime partite e ultimi risultati.
      </p>

      <form id="form-ricerca" class="form-ricerca d-flex gap-2" role="search">
        <label for="input-ricerca" class="visually-hidden">Nome della squadra</label>
        <input
          type="search"
          id="input-ricerca"
          name="squadra"
          class="form-control"
          placeholder="Es. Arsenal"
          required
        />
        <button type="submit" class="btn btn-cerca">Cerca</button>
      </form>
    </header>

    <main class="container contenitore pb-5">
      <!-- SQUADRE PREFERITE -->
      <section aria-labelledby="titolo-preferiti">
        <h2 id="titolo-preferiti" class="titolo-sezione">
          <span aria-hidden="true">⭐</span> Le tue squadre preferite
        </h2>

        <div id="lista-preferiti" class="d-flex flex-wrap gap-3">
          <!-- ESEMPIO STATICO: lo toglieremo quando lo genererà il JS -->
          <article class="card-preferita">
            <img src="https://placehold.co/100x100" alt="Logo Inter Milan" />
            <h3>Inter Milan</h3>
            <p>Italian Serie A</p>
            <p>Italy</p>
            <button type="button" class="btn btn-rimuovi">
              <span aria-hidden="true">🗑</span> Rimuovi
            </button>
          </article>
          <!-- FINE ESEMPIO -->
        </div>
      </section>

      <!-- RISULTATI DELLA RICERCA -->
      <section aria-labelledby="titolo-risultati">
        <h2 id="titolo-risultati" class="titolo-sezione">Squadre trovate</h2>

        <div id="risultati">
          <!-- ESEMPIO STATICO: lo toglieremo quando lo genererà il JS -->
          <article class="card-risultato">
            <h3>Barcelona</h3>

            <div class="row g-4">
              <div class="col-12 col-md-6">
                <h4 class="titolo-eventi">Prossimi eventi</h4>
                <ul class="lista-eventi list-unstyled mb-0">
                  <li class="nessun-evento">Nessun evento in programma</li>
                </ul>
              </div>

              <div class="col-12 col-md-6">
                <h4 class="titolo-eventi">Ultimi risultati</h4>
                <ul class="lista-eventi list-unstyled mb-0">
                  <li>
                    <span class="data-evento">17/05/2026</span>
                    <span class="nome-evento">Barcelona vs Real Betis</span>
                    <span class="badge bg-success ms-2">3 - 1</span>
                  </li>
                </ul>
              </div>
            </div>
          </article>
          <!-- FINE ESEMPIO -->
        </div>
      </section>
    </main>
  </body>
</html>
