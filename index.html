<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SportsHub</title>

    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Il mio CSS, dopo Bootstrap -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <!-- Punto di ingresso dei moduli -->
    <script type="module" src="assets/js/main.js"></script>
  </head>

  <body>
    <!-- HEADER CON RICERCA -->
    <header class="hero">
      <h1 class="hero-titolo">SportsHub</h1>
      <p class="hero-sottotitolo">
        Cerca una squadra, scopri prossime partite e ultimi risultati.
      </p>

      <form id="form-ricerca" class="form-ricerca d-flex gap-2" role="search">
        <label for="input-ricerca" class="visually-hidden">Nome della squadra</label>
        <input
          type="search"
          id="input-ricerca"
          name="squadra"
          class="form-control"
          placeholder="es. Arsenal, Lakers, Real Madrid..."
          required
        />
        <button type="submit" class="btn btn-cerca">Cerca</button>
      </form>
    </header>

    <main class="container contenitore pb-5">
      <!-- SQUADRE PREFERITE -->
      <section aria-labelledby="titolo-preferiti">
        <h2 id="titolo-preferiti" class="titolo-sezione">
          <span aria-hidden="true">⭐</span> Le tue squadre preferite
        </h2>
        <div id="lista-preferiti" class="d-flex flex-wrap gap-3">
          <p class="nessun-risultato">
            Non hai ancora salvato nessuna squadra. Cercane una qui sopra e
            aggiungila ai preferiti.
          </p>
        </div>
      </section>

      <!-- RISULTATI DELLA RICERCA -->
      <section aria-labelledby="titolo-risultati">
        <h2 id="titolo-risultati" class="titolo-sezione">Squadre trovate</h2>

        <!-- Alert errore (nascosto) -->
        <div id="errore" class="alert alert-danger d-none" role="alert"></div>

        <!-- Spinner (nascosto) -->
        <div id="spinner" class="d-flex justify-content-center my-4 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Caricamento...</span>
          </div>
        </div>

        <!-- Card delle squadre trovate -->
        <div id="lista-squadre" class="d-flex flex-wrap gap-3">
          <p class="nessun-risultato">Inizia cercando una squadra qui sopra.</p>
        </div>

        <!-- Dettagli della squadra selezionata -->
        <div id="dettagli"></div>
      </section>
    </main>
  </body>
</html>
